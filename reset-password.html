<!DOCTYPE html><html lang="ms"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5a0812"><meta name="robots" content="noindex,nofollow"><title>Reset Password — Roda Impian PGPM</title><link rel="icon" type="image/x-icon" href="assets/images/favicon/favicon.ico"><link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon/favicon-32x32.png"><link rel="apple-touch-icon" sizes="180x180" href="assets/images/favicon/apple-touch-icon.png"><link rel="manifest" href="site.webmanifest"><link rel="stylesheet" href="auth.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth-config.js"></script></head><body><div class="topline"></div><main><section class="shell"><div class="card"><header class="header"><div class="logo-wrap"><img src="assets/images/pgpm-logo.png" alt="Logo Pertubuhan Gerak Panglima Malaysia"></div><p class="org">Pertubuhan Gerak Panglima Malaysia</p><h1 class="app-title">PASSWORD BAHARU</h1><div class="separator"></div></header><div class="content"><p class="lead">Tetapkan password baharu untuk akaun Roda Impian PGPM anda.</p><div id="loading" class="status show"><h2>Memproses pautan...</h2><p>Sila tunggu sebentar.</p></div><form class="form" id="form" style="display:none"><div class="field"><label for="p1">Password baharu</label><input id="p1" type="password" autocomplete="new-password" minlength="8" required></div><div class="field"><label for="p2">Sahkan password</label><input id="p2" type="password" autocomplete="new-password" minlength="8" required></div><button id="btn" type="submit">UPDATE PASSWORD</button></form><div id="status" class="status"></div></div></div></section></main><footer><div class="signature">~hariz · dev / designer / maintener / engineer</div><div class="copyright">© 2026 Pertubuhan Gerak Panglima Malaysia<br>All rights reserved.</div></footer><script>const {createClient}=supabase;const sb=createClient(PGPM_AUTH.SUPABASE_URL,PGPM_AUTH.SUPABASE_PUBLISHABLE_KEY);const loading=document.getElementById("loading"),form=document.getElementById("form"),st=document.getElementById("status"),btn=document.getElementById("btn");function show(cls,title,msg){st.className="status show "+cls;st.innerHTML=`<h2>${title}</h2><p>${msg}</p>`}async function init(){try{const url=new URL(location.href);const code=url.searchParams.get("code");if(code){const {error}=await sb.auth.exchangeCodeForSession(code);if(error)throw error}const {data:{session}}=await sb.auth.getSession();if(!session)throw new Error("Pautan reset tidak sah, telah tamat tempoh atau telah digunakan.");loading.style.display="none";form.style.display="block"}catch(e){loading.style.display="none";show("error","Link tidak sah",escapeHtml(e.message))}}form.addEventListener("submit",async e=>{e.preventDefault();const a=document.getElementById("p1").value,b=document.getElementById("p2").value;if(a!==b)return show("error","Password tidak sama","Sila pastikan kedua-dua password sama.");btn.disabled=true;const {error}=await sb.auth.updateUser({password:a});if(error){show("error","Gagal kemas kini",escapeHtml(error.message));btn.disabled=false;return}await sb.auth.signOut();show("success","Password berjaya dikemas kini","Anda boleh kembali ke Roda Impian PGPM dan log masuk menggunakan password baharu.");form.style.display="none"});function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}init();</script></body></html>
